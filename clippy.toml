# `println!` in a test is the test's output, not a stray print in the library.
allow-print-in-tests = true
# SIMD intrinsics modules export hundreds of functions; listing them by hand only rots.
allowed-wildcard-imports = ["x86_64", "aarch64", "arch"]
# The house rule bans inline `crate::` paths. A standard-library path may stay inline, which is
# what a gated field or statement uses instead of a cfg'd import.
absolute-paths-allowed-crates = ["std", "core", "alloc"]

# State lives on an owner. A `thread_local!` that the outside world forces gets an `expect`
# saying so. The ban names the `LocalKey` the macro makes: clippy reads a lint level for an
# item-position macro at the crate root alone, so an `expect` on its module would not apply.
disallowed-types = [
    { path = "std::thread::LocalKey", reason = "state lives on an owner and travels by parameter" },
]

# A group's sampling is set through `Scale` (`src/bench/policy.rs`), the one
# policy every case shares; `Scale::apply` alone calls these.
disallowed-methods = [
