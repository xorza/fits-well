[package]
name = "fits-well"
version = "0.2.0"
edition = "2024"
description = "A blazing-fast reader and writer for FITS (Flexible Image Transport System) files, targeting the full FITS 4.0 standard."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xorza/fits"
readme = "README.md"
keywords = ["fits", "astronomy", "image", "fileformat"]
categories = ["science", "parser-implementations"]
# Keep the published tarball lean: the test fixtures and suites, the verbatim FITS
# standard reference (incl. a 1.1 MiB PDF), and editor/AI dev notes aren't needed to
# build or use the crate. Source, examples, benches, README, and licenses stay in.
exclude = [
    "docs/",
    "test_resources/",
    "tests/",
    ".claude/",
    "AGENTS.md",
    "CLAUDE.md",
    "todo.txt",
]

# One lint set for every crate of the Darkroom workspace, copied here because a submodule does
# not inherit it. Warn, not deny: the verification chain runs clippy with `-D warnings`, and a
# build in the middle of an edit keeps working. Every suppression in code is
# `#[expect(.., reason = "..")]`.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation is reviewed, not linted, for these.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# `assert!(x.is_empty())` reads plainer than a comparison with an empty array.
assert_is_empty = "allow"
# `usize -> f32/f64` in numeric code: a hit says nothing unless the value passes 2^24, and the
# code cannot show that.
cast_precision_loss = "allow"
# `f64 -> f32` narrowing is the design of the f32 pipelines.
cast_possible_truncation = "allow"
# Math code names things `x`, `y`, `dx`, `dy`, `cx`.
similar_names = "allow"
many_single_char_names = "allow"
# Size is a review question, not a lint.
too_many_lines = "allow"
# `#[inline(always)]` on `#[target_feature]` SIMD helpers is deliberate.
inline_always = "allow"
# Exact comparison is deliberate: sample-domain scales, sentinels, tests of exact values.
float_cmp = "allow"
# Every pointer cast feeds an unaligned load (`_mm_loadu_*`).
cast_ptr_alignment = "allow"
# `u32 -> i32` wraps only above 2^31, and `cast_possible_truncation`, allowed above, already
# admits the wider `usize -> i32`.
cast_possible_wrap = "allow"
# Backticks in docs are reviewed, not linted: every proper noun was one more exception to list.
doc_markdown = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assigning_clones = "warn"
cast_lossless = "warn"
cast_sign_loss = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
ignore_without_reason = "warn"
items_after_statements = "warn"
items_after_test_module = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
# `const fn` by default: every fn that can be one is.
missing_const_for_fn = "warn"
missing_fields_in_debug = "warn"
needless_pass_by_value = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
self_named_module_files = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
struct_field_names = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
unreadable_literal = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"

# Render docs.rs with every user-facing feature so compression and mmap appear.
# `internals` and `bench` are left out: they expose unstable test and bench entry
# points that do not belong in the public docs.
[package.metadata.docs.rs]
features = ["compression", "parallel", "mmap"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Always-on core dependencies (the corresponding column kinds aren't feature-gated):
# `bitvec` backs `X` bit-array columns, `num-complex` the `C`/`M` complex columns.
bitvec = "1"
num-complex = "0.4"
thiserror = "2.0"
flate2 = { version = "1.1", optional = true }
rayon = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }
criterion = { version = "0.8", optional = true }

[features]
default = ["parallel"]
# rayon-backed tile-parallel (de)compression — the codecs are compute-bound and
# tiles are independent, so this scales near-linearly. Scalar fallback otherwise.
# (The raw byte-swap / BSCALE-BZERO paths are memory-bound; profiling found neither
# threads nor SIMD their lever — buffer reuse is — so they are deliberately left
# serial and scalar.) Implies `compression`, since the codecs are the only thing
# parallelized.
parallel = ["compression", "dep:rayon"]
# memory-mapped read sources (via memmap2) for zero-copy access over large files:
# data units decode straight from the mapped pages, skipping the staging copy.
mmap = ["dep:memmap2"]
# tiled image + table (de)compression: all five image codecs (GZIP_1, GZIP_2,
# RICE_1, PLIO_1, HCOMPRESS_1) plus §10.3 tables. Pulls in flate2 for the gzip
# codecs. The WCS (§8) and time (§9) layers are dependency-free and always compiled.
compression = ["dep:flate2"]
# Crate-private fixtures re-exposed for the integration tests. NOT a stable API.
internals = []
# The criterion groups the benches under `benches/` run: `cargo bench --features bench`.
bench = ["internals", "dep:criterion"]

# Each bench binary runs the criterion groups of one area (`fits_well::bench`).
# Throughput is tagged in bytes or elements, so results compare with memory
# bandwidth: `cargo bench --features bench --bench decode`.
[[bench]]
name = "decode"
harness = false
required-features = ["bench"]

# Seeking (copy into scratch) against in-memory borrow; add `mmap` for its arm.
[[bench]]
name = "read"
harness = false
required-features = ["bench"]

[[bench]]
name = "compress"
harness = false
required-features = ["bench", "compression"]

[[bench]]
name = "wcs"
harness = false
required-features = ["bench"]

[[test]]
name = "wcs_allocations"
required-features = ["internals"]

# The `compression` example uses the tiled-compression API, so it only builds with
# that feature (the others are auto-discovered and feature-free).
[[example]]
name = "compression"
required-features = ["compression"]

[[example]]
name = "emit_compressed"
required-features = ["compression"]
