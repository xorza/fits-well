[package]
name = "fits-well"
version = "0.1.5"
edition = "2024"
description = "A blazing-fast reader and writer for FITS (Flexible Image Transport System) files, targeting the full FITS 4.0 standard."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xorza/fits"
readme = "README.md"
keywords = ["fits", "astronomy", "image", "fileformat"]
categories = ["science", "parser-implementations"]
# Keep the published tarball lean: the ~11 MiB of test fixtures, the verbatim FITS
# standard reference (incl. a 1.1 MiB PDF), and editor/AI dev notes aren't needed to
# build or use the crate. Source, examples, benches, README, and licenses stay in.
exclude = [
    "docs/",
    "tests/",
    ".claude/",
    "AGENTS.md",
    "CLAUDE.md",
    "todo.txt",
]

[lints.rust]
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
clone_on_ref_ptr = "deny"
items_after_test_module = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

# Render docs.rs with every user-facing feature so compression and mmap appear.
# `internals` and `bench` are left out: they expose unstable test and bench entry
# points that do not belong in the public docs.
[package.metadata.docs.rs]
features = ["compression", "parallel", "mmap"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Always-on core dependencies (the corresponding column kinds aren't feature-gated):
# `bitvec` backs `X` bit-array columns, `num-complex` the `C`/`M` complex columns.
bitvec = "1"
num-complex = "0.4"
thiserror = "2.0"
flate2 = { version = "1.1", optional = true }
rayon = { version = "1", optional = true }
memmap2 = { version = "0.9", optional = true }

criterion = { version = "0.8", optional = true }

[features]
default = ["parallel"]
# rayon-backed tile-parallel (de)compression — the codecs are compute-bound and
# tiles are independent, so this scales near-linearly. Scalar fallback otherwise.
# (The raw byte-swap / BSCALE-BZERO paths are memory-bound; profiling found neither
# threads nor SIMD their lever — buffer reuse is — so they are deliberately left
# serial and scalar.) Implies `compression`, since the codecs are the only thing
# parallelized.
parallel = ["compression", "dep:rayon"]
# memory-mapped read sources (via memmap2) for zero-copy access over large files:
# data units decode straight from the mapped pages, skipping the staging copy.
mmap = ["dep:memmap2"]
# tiled image + table (de)compression: all five image codecs (GZIP_1, GZIP_2,
# RICE_1, PLIO_1, HCOMPRESS_1) plus §10.3 tables. Pulls in flate2 for the gzip
# codecs. The WCS (§8) and time (§9) layers are dependency-free and always compiled.
compression = ["dep:flate2"]
# Crate-private fixtures re-exposed for the integration tests. NOT a stable API.
internals = []
# The criterion groups the benches under `benches/` run: `cargo bench --features bench`.
bench = ["internals", "dep:criterion"]

# Each bench binary runs the criterion groups of one area (`fits_well::bench`).
# Throughput is tagged in bytes or elements, so results compare with memory
# bandwidth: `cargo bench --features bench --bench decode`.
[[bench]]
name = "decode"
harness = false
required-features = ["bench"]

# Seeking (copy into scratch) against in-memory borrow; add `mmap` for its arm.
[[bench]]
name = "read"
harness = false
required-features = ["bench"]

[[bench]]
name = "compress"
harness = false
required-features = ["bench", "compression"]

[[bench]]
name = "wcs"
harness = false
required-features = ["bench"]

[[test]]
name = "wcs_allocations"
required-features = ["internals"]

# The `compression` example uses the tiled-compression API, so it only builds with
# that feature (the others are auto-discovered and feature-free).
[[example]]
name = "compression"
required-features = ["compression"]

[[example]]
name = "emit_compressed"
required-features = ["compression"]
