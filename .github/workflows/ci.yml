name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run of its branch or pull request, master included: only the
# latest commit's result is read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No RUSTFLAGS: it would replace the x86-64-v3 flags of `.cargo/config.toml`. The driver's commit is
# the one the drive table's `version` takes.
env:
  DRIVE_REV: 271baf137770ad5ff14c3089bf82eee70025fcb6

# `xorza/rust-ci` holds the steps each repository and OS shares. Its actions read bash, and a `run`
# gets `pipefail` only from a named shell.
defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang in the tests ends at its step's limit.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # GitHub hosts no x64 Windows 11 runner; Windows Server 2025 shares its kernel.
        os: [ubuntu-26.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/setup@9629682b748c30f471b2904c9c85a520765cb542 # master
      - uses: xorza/rust-ci/crash-capture@9629682b748c30f471b2904c9c85a520765cb542 # master
      # The gate of AGENTS.md, one step per command, each run past an earlier failure, so one run
      # reports every lane. The build apart from the run, so each shows its own time.
      - run: cargo fmt --all --check
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-compression
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-lint-bare
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-ship
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test --no-run
      - uses: xorza/rust-ci/test@9629682b748c30f471b2904c9c85a520765cb542 # master
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-test
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-test-compression --no-run
      - uses: xorza/rust-ci/test@9629682b748c30f471b2904c9c85a520765cb542 # master
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-test-compression
      - if: ${{ !cancelled() }}
        run: cargo --locked gate-doc
      - uses: xorza/rust-ci/test@9629682b748c30f471b2904c9c85a520765cb542 # master
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: cargo --locked gate-doctest
      - uses: xorza/rust-ci/test@9629682b748c30f471b2904c9c85a520765cb542 # master
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        with:
          command: bash scripts/examples.sh
      - uses: xorza/rust-ci/failure-report@9629682b748c30f471b2904c9c85a520765cb542 # master
        if: failure()

  api-surface:
    name: public API surface
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/setup@9629682b748c30f471b2904c9c85a520765cb542 # master
      - run: cargo install --locked --git https://github.com/xorza/drive --rev "$DRIVE_REV"
      # The committed surface must be what the tree renders: a change to the public API shows
      # here as a diff until `.notes/API_SURFACE.md` is rendered again with it.
      - run: cargo drive surface
      - run: git diff --exit-code -- .notes/API_SURFACE.md

  workflows:
    name: workflow checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: xorza/rust-ci/workflow-check@9629682b748c30f471b2904c9c85a520765cb542 # master
